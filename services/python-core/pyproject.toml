[project]
name = "aodcast-python-core"
version = "0.1.0"
description = "Python orchestration core for Aodcast"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "markdown-it-py>=3.0.0",
  "miniaudio>=1.61",
  "numpy>=2.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.26",
  "pytest>=8,<10",
  "ruff>=0.12",
]

[project.scripts]
aodcast-python-core = "app.main:run"

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
