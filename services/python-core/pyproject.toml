[project]
name = "aodcast-python-core"
version = "0.1.0"
description = "Python orchestration core for Aodcast"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "markdown-it-py>=3.0.0",
  "miniaudio>=1.61",
  "numpy>=2.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
local-mlx = [
  "mlx; sys_platform == 'darwin'",
  "mlx-audio[tts]==0.4.6; sys_platform == 'darwin'",
]
test = [
  "jsonschema>=4.26",
]

[project.scripts]
aodcast-python-core = "app.main:run"

[tool.uv]
package = true
