[project]
name = "aodcast-speech-service"
version = "0.1.0"
description = "Memory-bounded local MLX TTS and ASR service for Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio[stt,tts]==0.5.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.22",
    "soundfile>=0.13,<1",
    "numpy>=2,<3",
    "psutil>=6,<8",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
kokoro = ["misaki[zh]>=0.9.4,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
