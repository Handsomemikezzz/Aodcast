name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'feature/**'

jobs:
  speech-service:
    name: Verify isolated speech service (no model downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install audio codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install speech service test environment
        working-directory: speech-service
        run: uv sync --frozen --group dev

      - name: Speech service lint
        working-directory: speech-service
        run: uv run --frozen ruff check .

      - name: Speech service unit and HTTP tests
        working-directory: speech-service
        run: uv run --frozen python -m pytest -q

  verify:
    name: Verify source alpha
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python core
        working-directory: services/python-core
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[test]"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Startup lifecycle contracts
        run: python3 scripts/verification/test-startup-lifecycle.py

      - name: Rust cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Python tests, desktop typecheck/tests/build, and repository hygiene
        # The separate Python 3.12 job covers speech without native MLX or model weights.
        run: ./scripts/maintenance/run-repo-hygiene-check.sh --skip-speech-checks
